components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Format illustratif; mécanisme et cycle de session à choisir.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Recommandée pour éviter le double traitement d'une opération rejouée.
      schema: {type: string, maxLength: 128}
  responses:
    Success:
      description: Opération réussie
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessEnvelope'}
    Created:
      description: Ressource créée
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessEnvelope'}
    Unauthorized:
      description: Authentification absente ou invalide
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: Droits insuffisants
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Ressource introuvable ou inaccessible
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: Opération incompatible avec l'état actuel ou déjà effectuée
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Données invalides ou refusées par une règle métier
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    TooManyRequests:
      description: Limite de requêtes atteinte
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data, error]
      properties:
        success: {const: true}
        message: {type: string}
        data:
          description: Résultat propre à l'opération.
          anyOf:
            - {type: object, additionalProperties: true}
            - {type: array, items: {}}
            - {type: 'null'}
        error: {type: 'null'}
    ErrorEnvelope:
      type: object
      required: [success, message, data, error]
      properties:
        success: {const: false}
        message: {type: string}
        data: {type: 'null'}
        error:
          type: object
          required: [code]
          properties:
            code: {type: string, description: Identifiant d'erreur stable}
            details:
              description: Détails de validation sans information sensible.
              anyOf:
                - {type: object, additionalProperties: true}
                - {type: array, items: {}}
                - {type: 'null'}
    Inscription:
      type: object
      required: [nom, email, mot_de_passe]
      properties:
        nom: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, format: email}
        telephone: {type: string, maxLength: 32}
        mot_de_passe: {type: string, format: password, minLength: 12}
        localisation_livraison: {type: string, maxLength: 500}
        code_parrainage: {type: string, description: Facultatif; soumis aux règles d'éligibilité}
    Connexion:
      type: object
      required: [email, mot_de_passe]
      properties:
        email: {type: string, format: email}
        mot_de_passe: {type: string, format: password}
    ProfilModifiable:
      type: object
      minProperties: 1
      properties:
        nom: {type: string, minLength: 2, maxLength: 120}
        telephone: {type: string, maxLength: 32}
        localisation_livraison: {type: string, maxLength: 500}
    Plat:
      type: object
      required: [nom, prix, disponible]
      properties:
        nom: {type: string, maxLength: 160}
        description: {type: string, maxLength: 2000}
        prix:
          type: integer
          minimum: 0
          description: Montant en CDF à confirmer avec le restaurant.
        disponible: {type: boolean}
        categorie: {type: string, maxLength: 100}
    ArticleCommande:
      type: object
      required: [plat_id, quantite]
      properties:
        plat_id: {type: integer, minimum: 1}
        quantite: {type: integer, minimum: 1, maximum: 50}
    CommandeRequest:
      type: object
      required: [mode_service, articles]
      properties:
        mode_service: {type: string, enum: [sur_place, livraison]}
        heure_arrivee:
          type: string
          format: date-time
          description: Nécessité selon le mode à préciser.
        adresse_livraison:
          type: string
          maxLength: 500
          description: Requise pour livraison; employer des données fictives dans les exemples.
        articles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ArticleCommande'}
        points_utilises:
          type: integer
          minimum: 0
          description: Facultatif; taux non figé et solde vérifié par le serveur.
    StatutCommande:
      type: string
      enum: [en_attente, acceptee, en_preparation, prete, servie, livree, refusee, annulee]
      description: Proposition; statuts et transitions à valider.
    Employe:
      type: object
      required: [nom, email, mot_de_passe]
      properties:
        nom: {type: string, maxLength: 120}
        email: {type: string, format: email}
        telephone: {type: string, maxLength: 32}
        mot_de_passe: {type: string, format: password, minLength: 12}
        role:
          type: string
          const: employe
          description: Cette route ne permet pas d'auto-attribuer un rôle privilégié.
