name: "Mon Miam Miam — Signaler un bug"
description: "Remonter une anomalie de menu, commande, fidélité, rôles ou interface"
title: "fix: "
body:
  - type: dropdown
    id: module
    attributes:
      label: "Module affecté"
      options:
        - "Étudiant / Panier / Commande"
        - "Employé / Opérations"
        - "Gérant / Statistiques"
        - "Administrateur / Menu"
        - "Fidélité / Parrainage"
        - "Réclamations"
        - "Authentification / Permissions"
        - "Maquette / Autre"
    validations:
      required: true
  - type: input
    id: jira
    attributes:
      label: "Ticket Jira (si disponible)"
      placeholder: "Ex. MMM-12"
  - type: textarea
    id: actual
    attributes:
      label: "Résultat observé"
      description: "Ne pas inclure de mot de passe ou de données clients réelles."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Étapes de reproduction"
      placeholder: "1. Se connecter comme...\n2. Ajouter...\n3. Constater..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Résultat attendu"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environnement"
      placeholder: "Navigateur, appareil, branche/commit, environnement"
