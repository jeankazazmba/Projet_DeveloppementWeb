name: "Demander une fonctionnalité"
description: "Proposer un besoin ou une amélioration"
title: "feat: "
body:
  - type: textarea
    id: goal
    attributes:
      label: "Besoin utilisateur"
      description: "À quel problème répond cette fonctionnalité ?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Solution envisagée"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Critères d'acceptation"
      description: "Comment saurons-nous que la tâche est terminée ?"
      placeholder: "- [ ] Critère 1\n- [ ] Critère 2"
    validations:
      required: true
