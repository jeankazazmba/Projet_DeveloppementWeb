services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mon_miam_miam
      MYSQL_USER: mmm
      MYSQL_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Renseigner MYSQL_ROOT_PASSWORD dans .env}
    volumes:
      - mmm_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    image: mmm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Mon Miam Miam
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: mon_miam_miam
      DB_USERNAME: mmm
      DB_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"

  queue:
    image: mmm-backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      APP_NAME: Mon Miam Miam
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: mon_miam_miam
      DB_USERNAME: mmm
      DB_PASSWORD: ${DB_PASSWORD:?Renseigner DB_PASSWORD dans .env}
      QUEUE_CONNECTION: database
    command: php artisan queue:work database --queue=notifications,exports --sleep=2 --tries=3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mmm_mysql:
