services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE requis}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME requis}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis}
    volumes:
      - mmm_mysql_prod:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: mmm-backend-production
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment: &backend_environment
      APP_NAME: Mon Miam Miam
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY requis}
      APP_URL: https://${PUBLIC_HOST:?PUBLIC_HOST requis}
      APP_REQUIRE_HTTPS: "true"
      TRUSTED_PROXIES: ""
      FRONTEND_URL: https://${PUBLIC_HOST}
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST}
      CORS_SUPPORTS_CREDENTIALS: "false"
      LOG_CHANNEL: json
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      PAYMENT_SANDBOX_ENABLED: "false"
      SANCTUM_STATEFUL_DOMAINS: ${PUBLIC_HOST}
    volumes:
      - mmm_storage_prod:/var/www/html/storage
    networks: [private]

  queue:
    image: mmm-backend-production
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
      db: { condition: service_healthy }
    environment: *backend_environment
    volumes:
      - mmm_storage_prod:/var/www/html/storage
    command: php artisan queue:work database --queue=notifications,exports --sleep=2 --tries=3
    networks: [private]

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
      args:
        VITE_API_URL: https://${PUBLIC_HOST}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  mmm_mysql_prod:
  mmm_storage_prod:
