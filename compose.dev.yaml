services:
  db:
    ports:
      - "3306:3306"

  backend:
    environment:
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
      php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      target: build
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"

  mobile:
    build: ./mobile
    profiles: ["mobile"]
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://host.docker.internal:8000}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"

volumes:
  backend_vendor:
  frontend_node_modules:
  mobile_node_modules:
